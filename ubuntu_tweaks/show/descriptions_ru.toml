# Russian explanations for `ubuntu-tweak show` (loaded by show/descriptions.py).
#
# [panels.<id>]                       title and what the panel holds (ids from ../panels.toml, plus "other")
# [keys."<schema id>"]                "<key>" = { ru = "...", unit = "seconds", zero = "...", accel = true }
# [enums."<schema id>"."<key>"]       enum nick = its meaning
# [[rule]]                            paths = [dconf key globs], then the same fields as a key entry; for keys
#                                     without a schema here and for families of keys (window sizes, ...)
#
# unit: seconds | minutes | ms | percent | pixels | size | unix | bytes. A key without a text here falls back to the
# schema's own English summary, marked "(описание из схемы, без перевода)" in the report.

[panels.network]
title = "Сеть"
about = "Wi-Fi, Ethernet, VPN и прокси. Сами подключения хранят пароли, поэтому здесь они не показываются."

[panels.bluetooth]
title = "Bluetooth"
about = "Сопряжённые устройства и адаптеры: данные оборудования, не показываются."

[panels.background]
title = "Фон"
about = "Обои рабочего стола и картинка экрана блокировки."

[panels.appearance]
title = "Оформление"
about = "Тема, светлый/тёмный режим, акцентный цвет, шрифты, курсор и значки."

[panels.notifications]
title = "Уведомления"
about = "Показ уведомлений и настройки для каждого приложения."

[panels.search]
title = "Поиск"
about = "Какие источники участвуют в поиске по системе."

[panels.multitasking]
title = "Многозадачность"
about = "Окна, рабочие столы, плитка по краям экрана, горячий угол."

[panels.apps]
title = "Приложения"
about = "Настройки встроенных программ (Файлы, Терминал, Календарь, Papers и др.) и пароли-приложение."

[panels.privacy]
title = "Конфиденциальность"
about = "Блокировка экрана, диагностика, геолокация."

[panels.online-accounts]
title = "Онлайн-аккаунты"
about = "Токены и идентификаторы: не показываются."

[panels.sharing]
title = "Общий доступ"
about = "Удалённый рабочий стол и общий доступ к файлам. Ключи и сертификаты скрыты."

[panels.sound]
title = "Звук"
about = "Звуки событий, звук при запуске, громкость выше 100%."

[panels.power]
title = "Питание"
about = "Когда гаснет экран, когда компьютер засыпает, режим питания."

[panels.displays]
title = "Экраны"
about = "Ночной режим и цвет; расположение мониторов лежит в файле monitors.xml (см. «Файлы настроек»)."

[panels.mouse-touchpad]
title = "Мышь и тачпад"
about = "Скорость, прокрутка, жесты."

[panels.keyboard]
title = "Клавиатура"
about = "Раскладки, горячие клавиши, плитка окон."

[panels.printers]
title = "Принтеры"
about = "Принтеры и очередь печати."

[panels.removable-media]
title = "Съёмные носители"
about = "Что делать при подключении флешки или диска."

[panels.color]
title = "Цвет"
about = "Цветовые профили."

[panels.region-language]
title = "Язык и регион"
about = "Язык интерфейса, форматы даты и чисел."

[panels.accessibility]
title = "Универсальный доступ"
about = "Крупный шрифт, экранная клавиатура, лупа и т. п."

[panels.users]
title = "Пользователи"
about = "Учётные записи: не показываются."

[panels.date-time]
title = "Дата и время"
about = "Мировые часы и календарь; часовой пояс смотрите в «Время, язык и клавиатура»."

[panels.about]
title = "О системе"
about = "Сведения об устройстве."

[panels.ubuntu-desktop]
title = "Рабочий стол Ubuntu"
about = "Док, значки, закреплённые приложения, папки в обзоре приложений."

[panels.wellbeing]
title = "Цифровое благополучие"
about = "Напоминания об отдыхе и ограничения экранного времени."

[panels.shell-extensions]
title = "Расширения GNOME Shell"
about = "Какие расширения включены и их собственные настройки."

[panels.other]
title = "Прочее (без панели)"
about = "Ключи, которых нет ни в одной панели настроек: служебные данные программ и состояние окон."

