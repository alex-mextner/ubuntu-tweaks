# ---------------------------------------------------------------------------------------------------- families of keys

[[rule]]
paths = ["/**/window-size", "/**/initial-size", "/**/initial-size-file-chooser", "/**/size"]
ru = "Размер окна (ширина × высота): программа запоминает его, чтобы открыться таким же."
unit = "size"

[[rule]]
paths = ["/**/window-width", "/**/width", "/**/sidebar-width", "/**/sidebar-size", "/**/name-column-width"]
ru = "Запомненная ширина окна или его панели."
unit = "pixels"

[[rule]]
paths = ["/**/window-height", "/**/height"]
ru = "Запомненная высота окна."
unit = "pixels"

[[rule]]
paths = ["/**/is-maximized", "/**/window-maximized", "/**/maximized"]
ru = "Окно программы запоминает, было ли оно развёрнуто на весь экран."

[[rule]]
paths = ["/org/gnome/portal/filechooser/**"]
ru = "Папка, которую это приложение открывало в окне выбора файла в прошлый раз (служебное)."

[[rule]]
paths = ["/apps/update-manager/**", "/apps/seahorse/**"]
ru = "Служебные данные программы (размеры окна, счётчики запусков)."

[[rule]]
paths = ["/org/gnome/control-center/**"]
ru = "Параметры системы запоминают состояние окна."

[[rule]]
paths = ["/org/gnome/shell/extensions/dash2dock-lite/**"]
ru = "Настройка старого дока dash2dock-lite (его заменил hyperdock). Ключ остался в dconf от прежней установки."

[[rule]]
paths = ["/org/gnome/shell/extensions/gsconnect/**"]
ru = "GSConnect (связь с телефоном): имя устройства, сопряжение и сертификаты — идентификационные данные, не показываются."

[[rule]]
paths = ["/org/gnome/desktop/notifications/application/*/application-id"]
ru = "Приложение, у которого настроены свои уведомления."
