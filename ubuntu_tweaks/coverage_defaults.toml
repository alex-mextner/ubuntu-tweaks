# Engine layer of the coverage rules (spec, *Coverage*): the lowest layer, so a module's `[[coverage]]`, the
# profile's `coverage.toml` and the machine overlay's `coverage.toml` all override it, and anything the profile
# already declares (a linked file, a bundle key, a packages.toml name) is `tracked` before any of these applies.
#
# `match` are globs against item ids (`fnmatch`: `*` also crosses `/`; `[0-9]` is a character class).
# The `files` adapter reports TOP-LEVEL entries only (`~/.config/<entry>`, `~/.local/share/<entry>`,
# `~/.local/bin/<entry>`, `~/<dotfile>`), so a rule names an entry, never something inside it. A `secret` rule
# means "credentials live here"; the scanner reports that the entry exists and never reads or prints a value.
# Every rule needs a reason (`excluded` and `secret` are rejected without one).

# ---------------------------------------------------------------- caches, logs, generated and runtime state

[[coverage]]
match = ["file:~/.cache", "file:~/.npm", "file:~/.pnpm-store", "file:~/.yarn", "file:~/.gradle", "file:~/.m2", "file:~/.nv", "file:~/.wget-hsts"]
class = "excluded"
reason = "cache: rebuilt by the tool that owns it"

[[coverage]]
match = ["file:~/.config/*Cache*", "file:~/.config/*cache*", "file:~/.local/share/*Cache*", "file:~/.local/share/*cache*"]
class = "excluded"
reason = "cache: rebuilt by the app"

[[coverage]]
match = ["file:~/.config/*logs", "file:~/.config/*Logs", "file:~/.config/*.log", "file:~/.local/share/*.log"]
class = "excluded"
reason = "log files"

[[coverage]]
match = ["file:~/.config/*Crash Reports*", "file:~/.config/*crashpad*", "file:~/.config/*Crashpad*"]
class = "excluded"
reason = "crash dumps"

[[coverage]]
match = ["file:~/.config/*Singleton*", "file:~/.config/.org.chromium*", "file:~/.config/*.lock", "file:~/*.lock"]
class = "excluded"
reason = "runtime locks and sockets of a running browser or app"

[[coverage]]
match = ["file:~/.config/dconf"]
class = "excluded"
reason = "the dconf user database itself: its keys are covered one by one by the dconf adapter"

[[coverage]]
match = ["file:~/.config/pulse"]
class = "excluded"
reason = "PulseAudio / PipeWire cookie and per-device state, regenerated by the session"

[[coverage]]
match = ["file:~/.config/gnome-initial-setup*", "file:~/.config/session", "file:~/.config/user-dirs.locale"]
class = "excluded"
reason = "first-run and session markers written by the desktop"

[[coverage]]
match = ["file:~/.config/*~", "file:~/.local/share/*~", "file:~/.*~", "file:~/.gitconfig.pre-*", "file:~/.gitconfig.*premigrate*"]
class = "excluded"
reason = "backup copy a tool or a migration left next to the original"

[[coverage]]
match = ["file:~/.local/share/Trash", "file:~/.local/share/recently-used.xbel*", "file:~/.local/share/gvfs-metadata", "file:~/.local/share/nautilus", "file:~/.local/share/tracker3", "file:~/.local/share/gnome-software", "file:~/.local/share/gnome-settings-daemon", "file:~/.local/share/gnome-remote-desktop"]
class = "excluded"
reason = "desktop state: trash, recent files, file-manager metadata, indexes"

[[coverage]]
match = ["file:~/.local/share/mime", "file:~/.local/share/icc", "file:~/.local/share/doc", "file:~/.local/share/man", "file:~/.local/share/metainfo", "file:~/.local/share/gstreamer-1.0", "file:~/.local/share/kio", "file:~/.local/share/kservices5", "file:~/.local/share/dbus-1", "file:~/.local/bin/__pycache__"]
class = "excluded"
reason = "generated: caches and registries rebuilt by the tools that install into them"

[[coverage]]
match = ["file:~/.local/share/flatpak", "file:~/.var", "file:~/.local/share/containers", "file:~/.local/share/pipx", "file:~/.local/share/uv", "file:~/.local/share/pnpm"]
class = "excluded"
reason = "installed software and its data; the package adapters list what is installed"

[[coverage]]
match = ["file:~/.local/share/evolution", "file:~/.config/evolution"]
class = "excluded"
reason = "mail and calendar data: personal content, not configuration"

[[coverage]]
match = ["file:~/.bash_history", "file:~/.zsh_history", "file:~/.lesshst", "file:~/.viminfo", "file:~/.python_history", "file:~/.node_repl_history", "file:~/.sqlite_history", "file:~/.psql_history", "file:~/.mysql_history"]
class = "excluded"
reason = "shell and tool history: state, and may hold typed secrets"

[[coverage]]
match = ["file:~/.zcompdump*", "file:~/.pytest_cache", "file:~/.ICEauthority", "file:~/.sudo_as_admin_successful", "file:~/.dbus"]
class = "excluded"
reason = "state and caches written by the shell, test runner or session"

[[coverage]]
match = ["file:~/.nvm", "file:~/.rustup", "file:~/.cargo", "file:~/.bun", "file:~/.nx", "file:~/.biome"]
class = "excluded"
reason = "toolchain installation directory (its config can be tracked file by file in files/)"

[[coverage]]
match = ["file:~/.files"]
class = "excluded"
reason = "the dotfiles checkout that holds the profile itself"

# ---------------------------------------------------------------- secrets: reported, never read or shown

[[coverage]]
match = ["file:~/.config/*keyring*", "file:~/.local/share/keyrings", "file:~/.local/share/*keyring*", "file:~/.local/share/pki", "file:~/.pki"]
class = "secret"
reason = "keyrings and certificate databases: private keys and stored passwords"

[[coverage]]
match = ["file:~/.ssh", "file:~/.gnupg", "file:~/.password-store", "file:~/.config/sops", "file:~/.config/age"]
class = "secret"
reason = "private keys (id_*, secret keyrings); known_hosts and config can be tracked file by file in files/"

[[coverage]]
match = ["file:~/.config/gh", "file:~/.config/hub", "file:~/.config/glab-cli", "file:~/.config/forgejo-cli", "file:~/.git-credentials", "file:~/.config/git/credentials"]
class = "secret"
reason = "forge login: gh/hosts.yml and credential files hold access tokens (config.yml can be tracked in files/)"

[[coverage]]
match = ["file:~/.config/1Password", "file:~/.config/op", "file:~/.config/Bitwarden", "file:~/.config/Signal", "file:~/.config/discord", "file:~/.config/Slack"]
class = "secret"
reason = "password managers and messengers: vaults, session tokens and message stores"

[[coverage]]
match = ["file:~/.config/google-chrome*", "file:~/.config/chromium*", "file:~/.config/BraveSoftware", "file:~/.config/microsoft-edge*", "file:~/.config/vivaldi*", "file:~/.mozilla", "file:~/.thunderbird", "file:~/.config/mozilla"]
class = "secret"
reason = "browser profiles: saved logins, cookies and the credential store"

[[coverage]]
match = ["file:~/.config/gcloud", "file:~/.aws", "file:~/.azure", "file:~/.kube", "file:~/.docker", "file:~/.config/rclone", "file:~/.config/cloudflare", "file:~/.config/configstore", "file:~/.config/goa-1.0", "file:~/.runpod"]
class = "secret"
reason = "cloud and CLI credential stores (OAuth tokens, API keys, account secrets)"

[[coverage]]
match = ["file:~/.netrc", "file:~/.npmrc", "file:~/.pypirc", "file:~/.Xauthority", "file:~/.env", "file:~/.config/*.env", "file:~/.config/*token*", "file:~/.config/*Token*", "file:~/.config/*tokens*", "file:~/.local/share/*token*"]
class = "secret"
reason = "files that hold tokens, passwords or authentication cookies"

# ---------------------------------------------------------------- packages shipped with the distribution

[[coverage]]
match = ["apt:linux-*", "apt:language-pack-*", "apt:ubuntu-*", "apt:grub-*", "apt:shim-signed", "apt:snapd", "apt:cloud-init", "apt:netplan.io", "apt:initramfs-tools"]
class = "excluded"
reason = "base system of the distribution: kernel, boot loader, language packs, Ubuntu metapackages"

[[coverage]]
match = ["snap:core", "snap:core[0-9]*", "snap:bare", "snap:snapd", "snap:gtk-common-themes", "snap:gnome-*", "snap:mesa-*", "snap:kf5-*", "snap:snapd-desktop-integration", "snap:firmware-updater", "snap:prompting-client"]
class = "excluded"
reason = "snap platform: bases, runtimes and the store/desktop integration that Ubuntu ships"

[[coverage]]
match = ["npm:npm", "npm:corepack"]
class = "excluded"
reason = "bundled with node itself"

# ---------------------------------------------------------------- units and extensions the desktop ships

[[coverage]]
match = ["unit:pipewire*", "unit:wireplumber*", "unit:filter-chain.service", "unit:pulseaudio*", "unit:gcr-ssh-agent*", "unit:gnome-*", "unit:gpg-agent*", "unit:dirmngr*", "unit:obex.service", "unit:mpris-proxy.service", "unit:spice-vdagent.service", "unit:org.freedesktop.IBus*", "unit:snap.*", "unit:snapd.*", "unit:ubuntu-report*", "unit:xdg-*", "unit:dbus*", "unit:tracker-*", "unit:localsearch-*", "unit:evolution-*", "unit:at-spi-dbus-bus.service", "unit:update-notifier*", "unit:launchpadlib*"]
class = "excluded"
reason = "systemd user units the desktop session ships and enables by default"

[[coverage]]
match = ["extension:ubuntu-appindicators@ubuntu.com", "extension:ubuntu-dock@ubuntu.com", "extension:ding@rastersoft.com", "extension:tiling-assistant@ubuntu.com"]
class = "excluded"
reason = "GNOME extension Ubuntu enables by default (the ubuntu-session defaults)"

# ---------------------------------------------------------------- /etc without root

[[coverage]]
match = ["etc:/etc/default/grub.d", "etc:/etc/default/cacerts", "etc:/etc/default/useradd"]
class = "excluded"
reason = "stock /etc/default file of the distribution"

[[coverage]]
match = ["etc:/etc/sudoers.d/README", "etc:/etc/sudoers.d/*README*"]
class = "excluded"
reason = "documentation file shipped by sudo"

[[coverage]]
match = ["etc:/etc/apt/sources.list.d/ubuntu.sources", "etc:/etc/apt/sources.list.d/*.distUpgrade", "etc:/etc/apt/sources.list.d/*.save"]
class = "excluded"
reason = "apt source file the distribution or its upgrader maintains"

# ---------------------------------------------------------------- dconf keys (same intent as capture's defaults)

[[coverage]]
match = ["dconf:*password*", "dconf:*passwd*", "dconf:*secret*", "dconf:*token*", "dconf:*credential*", "dconf:*certificate*", "dconf:*api-key*", "dconf:*apikey*", "dconf:*private-key*", "dconf:/org/gnome/shell/extensions/gsconnect/*"]
class = "secret"
reason = "the key name says credential, and KDE Connect pairing holds certificates; the value is never shown"

[[coverage]]
match = ["dconf:*/window-size", "dconf:*/window-width", "dconf:*/window-height", "dconf:*/window-state", "dconf:*/window-position", "dconf:*/window-maximized", "dconf:*/width", "dconf:*/height", "dconf:*/last-*", "dconf:*-timestamp", "dconf:*-time", "dconf:*/launch-count", "dconf:*/first-run"]
class = "excluded"
reason = "window geometry, last-used markers and timestamps an app writes by itself"
