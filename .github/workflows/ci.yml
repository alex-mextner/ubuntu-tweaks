name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # tomllib (3.11+) is used by modules/memguard
      - uses: actions/setup-node@v4  # modules/memguard/tests/test_polkit.py runs the polkit rule under node
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pip install ruff
      - name: Checks (scripts/ci.sh)
        run: scripts/ci.sh
