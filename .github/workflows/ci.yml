name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # tomllib (3.11+) is used by modules/memguard
      - uses: actions/setup-node@v4  # modules/memguard/tests/test_polkit.py runs the polkit rule under node
        with:
          node-version: "22"
      - name: Install tools
        # python3-gi + dbus + dconf: tests/test_settings.py runs the GSettings backend in a scratch
        # dbus-run-session; scripts/ci.sh runs the ubuntu_tweaks tests under /usr/bin/python3, which has gi.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-gi gir1.2-glib-2.0 dbus dconf-cli dconf-service dconf-gsettings-backend libglib2.0-bin gnome-shell-common gsettings-desktop-schemas
          pip install ruff
      - name: Checks (scripts/ci.sh)
        run: scripts/ci.sh
      - name: Integration (scripts/integration.sh)
        # apply --commit / status / apply --commit against a scratch dconf in dbus-run-session; it
        # skips itself (loudly) when the org.gnome.shell schema from gnome-shell-common or the
        # org.gnome.desktop.interface schema from gsettings-desktop-schemas is missing.
        run: scripts/integration.sh
