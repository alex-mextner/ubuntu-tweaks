description = "Init step 10: your dotfiles repository (found through gh: .files, dotfiles, .dotfiles, dot-files) cloned, with the ubuntu profile inside it; nothing to do when there is none"
enabled = true           # a machine can opt out: [modules.dotfiles] enabled = false in machines/<host>/machine.toml
order = 110
manual = "run `gh auth login`, or set [modules.dotfiles] repo / pass --dotfiles-repo OWNER/NAME; a checkout that is behind with local changes, or diverged, is yours to resolve in it"

# User level: it only clones into $HOME and fast-forwards that checkout; it never writes a file of the
# repository, links nothing and never touches the rest of the repository (zsh, brew, ...).
# Options: `[modules.dotfiles]` keys repo, dir, path (see install.sh and the spec, *Profile discovery*).
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"
