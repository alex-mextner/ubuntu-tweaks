# Managed by ubuntu-tweaks (module error-intercept). Replaces what update-notifier-crash.service runs: instead of
# apport's "Sorry, ... has experienced an internal error" dialog, the report is published to the agent
# subscribed to errors and archived. `error-intercept disable` hands the stock dialog back (no unit change needed).
[Service]
ExecStart=
ExecStart=@MODULE@/error-intercept ingest
