description = "Init step 1: zsh installed and set as the login shell"
enabled = true
order = 11      # right after base-tools (init step 1)
phase = "base"

[source]
kind = "builtin"

# No `provides`: chsh needs the apt build (listed in /etc/shells), even if a brew zsh is already on PATH.
[install]
apt = ["zsh"]

[[step]]
name = "login-shell"
shell = "zsh"
