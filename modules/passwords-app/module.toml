description = "passwords-app (iCloud Keychain): clone, install, enable the user daemon, native-messaging host"
enabled = true
order = 60   # init step 6
manual = "sign in to iCloud once: run `passwords-app signin` (Apple ID, password, 2FA code), then run apply again"

[source]
kind = "system"
root = false
install = "passwords-app install"
check = "passwords-app check"
# the author-published tool this module installs; override with [modules.passwords-app] repo = "..."
repo = "https://github.com/alex-mextner/passwords-app.git"
