# macOS 26 (Tahoe)-style Dash2Dock settings; install.sh loads this into
# /org/gnome/shell/extensions/dash2dock-lite/ and sets folder-stacks.
[/]
dock-location=0
icon-size=0.17000000000000001
icon-spacing=0.5
dock-padding=0.5
edge-distance=0.40000000000000002
apps-icon=true
apps-icon-front=true
favorites-only=false
trash-icon=true
downloads-icon=true
mounted-icon=false
separator-thickness=1
separator-color=(0.0, 0.0, 0.0, 0.45000000000000001)
running-indicator-style=2
running-indicator-size=0
running-indicator-color=(1.0, 1.0, 1.0, 0.90000000000000002)
animate-icons=true
animate-icons-unmute=true
animation-magnify=0.40000000000000002
animation-spread=0.40000000000000002
animation-rise=0.10000000000000001
open-app-animation=true
lamp-app-animation=false
autohide-dash=false
click-minimizes=false
icon-shadow=true
border-radius=2.0
border-thickness=0
background-color=(1.0, 1.0, 1.0, 0.12)
glass-material=true
glass-backdrop=1
glass-blur=10.0
glass-refraction=24.0
glass-rim=1.0
customize-label=true
label-border-radius=6.0
label-border-thickness=0
label-background-color=(0.12, 0.12, 0.12, 0.80000000000000004)
label-foreground-color=(1.0, 1.0, 1.0, 1.0)
max-recent-items=2
# Contrast: separator and marks follow wallpaper luminance
adaptive-contrast=true
# Trash: glass bin showing its contents
trash-style=1
# Apps: recent apps section, menu, keyboard, shift-click = new window
recent-apps-count=3
menu-open-at-login=true
keyboard-focus=true
hotkeys-overlay=true
shift-click-action=1
show-all-windows-item=true
click-action-spread=false
# Downloads stack: view, sort, display
downloads-stack-view=3
downloads-stack-sort=2
downloads-stack-display=1
# Badges and progress (Unity LauncherEntry API)
launcher-api=true
notification-badge-style=6
notification-badge-color=(1.0, 0.23000000000000001, 0.19, 1.0)
# Windows: genie minimize into the app icon, bounces
minimize-to-icon=true
minimize-effect=1
minimized-window-tiles=false
launch-bounce-anywhere=true
urgent-bounce=true
# Drag and drop, dock menu, autohide toggle
drag-off-remove=true
background-menu=true
spring-loading=true
# Off until https://github.com/alex-mextner/ubuntu-tweaks/issues/13 is fixed (first drag
# after the helper starts can leave the drop window over the dock); re-enable then.
file-drops=false
toggle-autohide-shortcut=['<Super><Alt>d']
